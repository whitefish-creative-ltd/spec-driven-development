# Builds sdd-action-pack.zip from action-pack/ and attaches it to a GitHub release
# whenever a version tag (v1.2.3) is pushed. The release notes are that version's
# section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the skills carry current templates
        run: scripts/sync-skill-templates.sh --check

      - name: Build the zip
        run: |
          mkdir -p dist/sdd-action-pack
          cp -R action-pack/. dist/sdd-action-pack/
          cp LICENSE dist/sdd-action-pack/
          cd dist && zip -rqX sdd-action-pack.zip sdd-action-pack -x '*.DS_Store'

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/sdd-action-pack.zip \
            --title "Spec-Driven Development Action Pack $GITHUB_REF_NAME" \
            --notes-file dist/notes.md
